<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">MiniMax Code Termux</title>
  <desc id="desc">Blue terminal-inspired MiniMax Code Termux wordmark.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DAEFF"/>
      <stop offset="1" stop-color="#0077FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="28" fill="#0B1220"/>
  <rect x="28" y="28" width="1144" height="204" rx="20" fill="#101A2B" stroke="#25486E" stroke-width="2"/>
  <g fill="url(#blue)" filter="url(#glow)" font-family="Menlo,Consolas,monospace" font-weight="700">
    <text x="72" y="120" font-size="62">&gt;_</text>
    <text x="230" y="118" font-size="62" letter-spacing="5">MINIMAX CODE</text>
    <text x="234" y="174" font-size="30" letter-spacing="12">TERMUX EDITION</text>
  </g>
  <circle cx="1080" cy="78" r="8" fill="#55D6BE"/>
  <circle cx="1110" cy="78" r="8" fill="#FFD166"/>
  <circle cx="1140" cy="78" r="8" fill="#FF6B6B"/>
</svg>
